name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Backend lint and smoke tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pip-audit

      - name: Verify Face ID dependency
        run: python -c "import cv2; print('OpenCV', cv2.__version__)"

      - name: Lint all Python source, tests, evaluation tools, and scripts
        run: python -m ruff check src tests eval scripts

      - name: Verify formatting
        run: python -m ruff format --check src tests eval scripts

      - name: Compile Python modules
        run: python -m compileall -q src tests eval scripts

      - name: Audit Python dependencies
        run: python -m pip_audit -r requirements.txt

      - name: Validate migration head and latest SQL
        run: |
          test "$(python -m alembic heads | wc -l)" -eq 1
          python -m alembic upgrade d5e6f7a8b9c0:e6f7a8b9c0d1 --sql > /dev/null

      - name: Validate golden evaluation suites
        run: python eval/runners/validate_schema.py

      - name: Run backend tests
        run: >-
          python -m pytest tests -q
          --cov=src/app
          --cov-report=term-missing
          --cov-fail-under=50
        env:
          APP_ENV: test
          OPENAI_API_KEY: test-key

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

      - name: Build frontend
        run: npm run build

  docker:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: [lint-and-test, frontend]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: timi-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: timi-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
